<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KAFKA — a smarter way to prepare for coding interviews, aptitude tests and placements." />
    <meta name="theme-color" content="#050505" />
    <title>KAFKA — Interview Preparation</title>
    <script>
      // Paint the right surface before the app loads (no light→dark flash).
      // The landing page and /status are Ink; sign-in pages are Paper; app pages
      // use the theme the user had last time (stored by App.vue), defaulting to Ink.
      ;(function () {
        var path = location.pathname.replace(/\/+$/, '') || '/'
        var surface = 'ink'
        if (path === '/login' || path === '/register') surface = 'paper'
        else if (path !== '/' && path !== '/status') {
          try {
            var saved = localStorage.getItem('kafka:theme')
            if (saved === 'paper' || saved === 'ink') surface = saved
          } catch (e) {}
        }
        document.documentElement.dataset.surface = surface
        document.querySelector('meta[name="theme-color"]').setAttribute('content', surface === 'ink' ? '#050505' : '#fffcf2')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
